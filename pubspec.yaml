name: bookshelf_app
description: A book management app with barcode scanning

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.2
  shared_preferences: ^2.2.2
  http: ^1.1.0
  mobile_scanner: ^3.5.5
  csv: ^6.0.0
  path_provider: ^2.1.1
  permission_handler: ^11.0.1
  device_info_plus: ^10.0.1
  
  image_picker: ^1.0.5
  google_mlkit_text_recognition: ^0.12.0
  path: ^1.8.3
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/Logo_01.png
    - assets/images/home_mascot_stage/

  fonts:
    - family: Spoqa Han Sans Neo
      fonts:
        - asset: assets/fonts/SpoqaHanSansNeo-Thin.ttf
          weight: 100
        - asset: assets/fonts/SpoqaHanSansNeo-Light.ttf
          weight: 300
        - asset: assets/fonts/SpoqaHanSansNeo-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpoqaHanSansNeo-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpoqaHanSansNeo-Bold.ttf
          weight: 700
